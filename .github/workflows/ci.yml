name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/voice-only, apps/abstract]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build

  landing:
    name: build landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: smoke test launcher
        run: python tests/smoke_test.py
        env:
          MODE_VOICE_ONLY_URL: http://localhost:3000
          MODE_ABSTRACT_URL: http://localhost:3002
